<!doctype html>
<!-- ========================================================================
     index.html — Vite document shell and React mount point
     ------------------------------------------------------------------------
     1. Document metadata       identity, discovery, favicon, and viewport
     2. Application bootstrap   root mount point and Vite entry module
     ======================================================================== -->
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/golden-lotus-logo.svg" />
    <link rel="canonical" href="https://omi-moitra.github.io/" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Nunito:wght@400..900&family=Offside&family=Playfair+Display:wght@600..800&family=WindSong:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Oishieka Moitra’s full stack developer portfolio, professional journey, selected work, resources, and contact form."
    />
    <meta name="theme-color" content="#F5EBD8" />
    <script>
      ;(() => {
        const storedTheme = localStorage.getItem('omi-portfolio-theme')
        const preference = ['light', 'dark', 'system'].includes(storedTheme)
          ? storedTheme
          : 'system'
        const resolvedTheme = preference === 'system'
          ? (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
          : preference
        document.documentElement.dataset.theme = resolvedTheme
        document.documentElement.style.colorScheme = resolvedTheme
      })()
    </script>
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://omi-moitra.github.io/#/" />
    <meta property="og:title" content="Oishieka Moitra | Full Stack Developer" />
    <meta
      property="og:description"
      content="A Phoenix Codex portfolio combining practical software engineering with accessible visual storytelling."
    />
    <meta
      property="og:image"
      content="https://omi-moitra.github.io/golden-lotus-logo.png"
    />
    <title>Oishieka Moitra | Full Stack Developer</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
