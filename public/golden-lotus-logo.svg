    <path class="petal" fill="url(#coral-left)" d="M17 57C29 48 40 51 48 61 35 70 23 68 17 57Z" />
    <path class="petal" fill="url(#violet-right)" d="M79 57C67 48 56 51 48 61 61 70 73 68 79 57Z" />
    <path class="petal" fill="url(#coral-down)" d="M48 59C39 65 40 75 48 79 56 75 57 65 48 59Z" />

    <g class="veins">
      <path d="M48 8c-2 14-2 26 0 38M31 15c2 13 6 24 10 34M65 15c-2 13-6 24-10 34" />
      <path d="M16 25c8 9 15 18 22 27M80 25c-8 9-15 18-22 27M48 22v36" />
      <path d="M9 46c14 2 25 6 34 12M87 46c-14 2-25 6-34 12" />
      <path d="M22 57c8 1 16 2 23 4M74 57c-8 1-16 2-23 4M48 63v12" />
    </g>
    <circle class="heart" cx="48" cy="59" r="3.2" />
