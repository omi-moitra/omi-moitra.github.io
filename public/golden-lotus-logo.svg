      <stop offset="100%" stop-color="#976fde" />
    </linearGradient>
    <linearGradient id="coral-down" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#ffc64a" />
      <stop offset="68%" stop-color="#ffc64a" />
      <stop offset="100%" stop-color="#da5640" />
    </linearGradient>
    <filter id="gold-glow" x="-20%" y="-24%" width="140%" height="148%">
      <feDropShadow dx="0" dy="0" stdDeviation="1.3" flood-color="#f5d97f" flood-opacity=".62" />
    </filter>
    <style>
      .petal { stroke: #232126; stroke-opacity: .58; stroke-width: 1.15; stroke-linejoin: round; }
      .veins { fill: none; stroke: #232126; stroke-opacity: .38; stroke-linecap: round; stroke-width: .7; }
      .heart { fill: #ffc64a; stroke: #232126; stroke-opacity: .58; stroke-width: 1; }
      @media (prefers-color-scheme: dark) {
        .petal, .heart { stroke: #fff9ed; }
        .veins { stroke: #fff9ed; }
      }
    </style>
  </defs>

