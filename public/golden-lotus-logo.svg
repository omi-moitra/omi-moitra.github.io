    <path class="petal" fill="url(#pale-up)" d="M26 27C23 43 32 55 46 60 43 43 35 32 26 27Z" />
    <path class="petal" fill="url(#coral-up)" d="M70 27C73 43 64 55 50 60 53 43 61 32 70 27Z" />
