    <path class="petal" fill="url(#blue-up)" d="M13 21C11 36 21 48 39 54 35 38 26 27 13 21Z" />
    <path class="petal" fill="url(#pale-up)" d="M83 21C85 36 75 48 57 54 61 38 70 27 83 21Z" />
