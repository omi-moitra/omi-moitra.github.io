<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 80" role="img" aria-labelledby="title description">
  <title id="title">Lotus logo</title>
  <desc id="description">The gold, coral, blue, pale gold, and violet lotus used by the portfolio navigator.</desc>
  <defs>
    <linearGradient id="coral-up" x1="50%" y1="100%" x2="50%" y2="0%">
      <stop offset="0%" stop-color="#ffc64a" />
      <stop offset="68%" stop-color="#ffc64a" />
      <stop offset="100%" stop-color="#da5640" />
    </linearGradient>
    <linearGradient id="blue-up" x1="50%" y1="100%" x2="50%" y2="0%">
      <stop offset="0%" stop-color="#ffc64a" />
      <stop offset="68%" stop-color="#ffc64a" />
      <stop offset="100%" stop-color="#396cbf" />
    </linearGradient>
    <linearGradient id="pale-up" x1="50%" y1="100%" x2="50%" y2="0%">
      <stop offset="0%" stop-color="#ffc64a" />
      <stop offset="68%" stop-color="#ffc64a" />
      <stop offset="100%" stop-color="#f5d97f" />
    </linearGradient>
    <linearGradient id="violet-up" x1="50%" y1="100%" x2="50%" y2="0%">
      <stop offset="0%" stop-color="#ffc64a" />
      <stop offset="68%" stop-color="#ffc64a" />
      <stop offset="100%" stop-color="#976fde" />
    </linearGradient>
    <linearGradient id="violet-left" x1="100%" y1="50%" x2="0%" y2="50%">
      <stop offset="0%" stop-color="#ffc64a" />
      <stop offset="68%" stop-color="#ffc64a" />
      <stop offset="100%" stop-color="#976fde" />
    </linearGradient>
    <linearGradient id="coral-left" x1="100%" y1="50%" x2="0%" y2="50%">
      <stop offset="0%" stop-color="#ffc64a" />
      <stop offset="68%" stop-color="#ffc64a" />
      <stop offset="100%" stop-color="#da5640" />
    </linearGradient>
    <linearGradient id="blue-right" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#ffc64a" />
      <stop offset="68%" stop-color="#ffc64a" />
      <stop offset="100%" stop-color="#396cbf" />
    </linearGradient>
    <linearGradient id="violet-right" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#ffc64a" />
